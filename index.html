<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OsLevel Devil</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #111;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 4px solid #fff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }
    canvas {
      background: #222;
      display: block;
    }
    .ui-overlay {
      position: absolute;
      top: 10px;
      left: 15px;
      font-size: 20px;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 2px 2px #000;
    }
    /* Mobil Kontrol Butonları */
    #mobile-controls {
      display: none;
      width: 100%;
      max-width: 800px;
      justify-content: space-between;
      padding: 10px 20px;
      margin-top: 10px;
    }
    .btn-group {
      display: flex;
      gap: 15px;
    }
    .touch-btn {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      touch-action: manipulation;
    }
    .touch-btn:active {
      background: rgba(255, 255, 255, 0.5);
    }
    @media (max-width: 850px) {
      #mobile-controls { display: flex; }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui-overlay">
      <span id="level-title">OsLevel Devil - Seviye 1</span>
    </div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
  </div>

  <!-- Mobil Ekran Dokunmatik Tuşları -->
  <div id="mobile-controls">
    <div class="btn-group">
      <div class="touch-btn" id="btn-left">◀</div>
      <div class="touch-btn" id="btn-right">▶</div>
    </div>
    <div class="btn-group">
      <div class="touch-btn" id="btn-jump">▲</div>
    </div>
  </div>

  <!-- External Harita Dosyası -->
  <script src="levels.js"></script>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let currentLevelIndex = 0;
    let currentLevel = null;

    // Oyuncu Nesnesi
    const player = {
      x: 0,
      y: 0,
      width: 24,
      height: 24,
      vx: 0,
      vy: 0,
      speed: 4,
      jumpForce: 10.5,
      gravity: 0.45,
      grounded: false,
      color: "#FFCC00"
    };

    // Girdi Durumu
    const keys = { left: false, right: false, jump: false };

    // Dinleyiciler - Klavye
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
      if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
      if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") keys.jump = true;
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
      if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
      if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") keys.jump = false;
    });

    // Mobil Dokunmatik Eventler
    const bindTouch = (id, key) => {
      const el = document.getElementById(id);
      el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[key] = true; });
      el.addEventListener("touchend", (e) => { e.preventDefault(); keys[key] = false; });
    };
    bindTouch("btn-left", "left");
    bindTouch("btn-right", "right");
    bindTouch("btn-jump", "jump");

    // Seviye Yükleme Fonksiyonu
    function loadLevel(index) {
      if (index >= LEVELS.length) {
        alert("TEBRİKLER! TÜM BÖLÜMLERİ BİTİRDİN!");
        currentLevelIndex = 0;
      }
      
      // Derin kopyalama ile veriyi sıfırla
      currentLevel = JSON.parse(JSON.stringify(LEVELS[currentLevelIndex]));
      player.x = currentLevel.playerStart.x;
      player.y = currentLevel.playerStart.y;
      player.vx = 0;
      player.vy = 0;
      
      document.getElementById("level-title").innerText = `OsLevel Devil - Seviye ${currentLevelIndex + 1}`;
    }

    // AABB Çarpışma Testi
    function isColliding(rect1, rect2) {
      return (
        rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y
      );
    }

    // Oyun Döngüsü - Güncelleme
    function update() {
      if (!currentLevel) return;

      // Kontroller ve Ters Kontrol Mekaniği
      let moveLeft = currentLevel.reverseControls ? keys.right : keys.left;
      let moveRight = currentLevel.reverseControls ? keys.left : keys.right;

      if (moveLeft) player.vx = -player.speed;
      else if (moveRight) player.vx = player.speed;
      else player.vx = 0;

      if (keys.jump && player.grounded) {
        player.vy = -player.jumpForce;
        player.grounded = false;
      }

      // Fizik Güncelleme
      player.vy += player.gravity;
      player.x += player.vx;

      // Yatay Çarpışma ve Platform Mekaniği
      currentLevel.platforms.forEach(plat => {
        if (plat.visible === false) return;

        // Troll Mekaniği: Yaklaşınca kaybolan zemin
        if (plat.disappearOnApproach) {
          let dist = Math.abs((player.x + player.width/2) - (plat.x + plat.width/2));
          if (dist < 80) plat.visible = false;
        }

        if (isColliding(player, plat)) {
          if (player.vx > 0) player.x = plat.x - player.width;
          else if (player.vx < 0) player.x = plat.x + plat.width;
        }
      });

      player.y += player.vy;
      player.grounded = false;

      // Düşey Çarpışma
      currentLevel.platforms.forEach(plat => {
        if (plat.visible === false) return;

        if (isColliding(player, plat)) {
          if (player.vy > 0) { // Düşerken zemine basma
            player.y = plat.y - player.height;
            player.vy = 0;
            player.grounded = true;

            // Troll Mekaniği: Dokununca düşen zemin
            if (plat.fallOnTouch) plat.falling = true;
          } else if (player.vy < 0) { // Tavana çarpma
            player.y = plat.y + plat.height;
            player.vy = 0;
          }
        }

        // Düşen platform hariti
        if (plat.falling) {
          plat.y += 6;
        }
      });

      // Hareket Eden Dikenler Güncellemesi
      if (currentLevel.spikes) {
        currentLevel.spikes.forEach(spike => {
          if (spike.moving) {
            spike.x += spike.speed;
            if (Math.abs(spike.x - spike.startX) > spike.range) {
              spike.speed *= -1;
            }
          }
          // Diken Çarpışması -> Ölüm!
          if (isColliding(player, spike)) {
            loadLevel(currentLevelIndex); // Yeniden Başlat
          }
        });
      }

      // Sahte Kapı Trollü
      if (currentLevel.trolls && currentLevel.trolls.trollDoor) {
        if (player.x > currentLevel.trolls.trollDoorTriggerX) {
          currentLevel.door.x = currentLevel.trolls.trollDoorTargetX;
        }
      }

      // Bölüm Sonu / Kapıya Ulaşma
      if (isColliding(player, { x: currentLevel.door.x, y: currentLevel.door.y, width: 30, height: 40 })) {
        currentLevelIndex++;
        loadLevel(currentLevelIndex);
      }

      // Haritadan Aşağı Düşme Durumu
      if (player.y > canvas.height + 100) {
        loadLevel(currentLevelIndex);
      }
    }

    // Ekran Çizimi
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!currentLevel) return;

      // Platformları Çiz
      ctx.fillStyle = "#fff";
      currentLevel.platforms.forEach(plat => {
        if (plat.visible !== false) {
          ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
        }
      });

      // Dikenleri Çiz (Tuzaklar)
      ctx.fillStyle = "#FF3333";
      if (currentLevel.spikes) {
        currentLevel.spikes.forEach(spike => {
          ctx.beginPath();
          ctx.moveTo(spike.x, spike.y + spike.height);
          ctx.lineTo(spike.x + spike.width / 2, spike.y);
          ctx.lineTo(spike.x + spike.width, spike.y + spike.height);
          ctx.fill();
        });
      }

      // Kapıyı Çiz (Hedef)
      ctx.fillStyle = "#00FF66";
      ctx.fillRect(currentLevel.door.x, currentLevel.door.y, 30, 40);

      // Oyuncuyu Çiz
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    // Ana Döngü
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Başlat
    loadLevel(currentLevelIndex);
    loop();
  </script>
</body>
</html>

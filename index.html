<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OsLevel Devil</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    /* Üst Bar */
    .top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 35px;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      z-index: 10;
    }
    .title { font-size: 13px; font-weight: bold; color: #FFCC00; }
    .btn-sm { background: #333; color: #fff; border: 1px solid #666; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .btn-sm.active { background: #00FF66; color: #000; font-weight: bold; }

    /* Editör Araç Barı */
    #editor-bar {
      display: none;
      position: absolute;
      top: 35px; left: 0; right: 0;
      height: 35px;
      background: #222;
      align-items: center;
      justify-content: center;
      gap: 5px;
      z-index: 10;
      border-bottom: 1px solid #444;
    }
    .tool-btn { background: #444; color: #fff; border: 1px solid #666; padding: 3px 6px; font-size: 10px; border-radius: 3px; cursor: pointer; }
    .tool-btn.selected { border: 2px solid #00FF66; background: #555; }

    /* Başlangıç Ekranı Menüsü */
    #start-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      z-index: 100;
    }
    #start-screen h1 { font-size: 32px; color: #FFCC00; text-shadow: 2px 2px #000; }
    .main-btn { background: #00FF66; color: #000; font-weight: bold; font-size: 18px; border: none; padding: 10px 30px; border-radius: 8px; cursor: pointer; }
    .file-input-label { background: #333; color: #fff; padding: 8px 15px; border-radius: 5px; font-size: 12px; cursor: pointer; border: 1px solid #555; }

    /* Obje Ayar Modalı */
    #modal-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 150;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: #222;
      border: 2px solid #00FF66;
      padding: 15px;
      border-radius: 8px;
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 12px;
    }
    .modal-box label { display: flex; justify-content: space-between; align-items: center; }
    .modal-box input[type="text"], .modal-box select, .modal-box input[type="number"] { background: #333; color: #fff; border: 1px solid #555; padding: 3px; font-size: 11px; width: 100px; }

    /* Canvas */
    canvas { width: 100vw; height: 100vh; object-fit: contain; display: block; background: #1a1a1a; }

    /* Ekran İçi Mobil Kontroller (Sağ/Sol Alt) */
    #touch-controls {
      position: absolute;
      bottom: 15px; left: 15px; right: 15px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 50;
    }
    .t-group { display: flex; gap: 10px; pointer-events: auto; }
    .t-btn {
      width: 50px; height: 50px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #fff; touch-action: manipulation;
    }
    .t-btn:active { background: rgba(255, 255, 255, 0.6); }
  </style>
</head>
<body>

  <div id="game-container">
    
    <!-- Başlangıç Menüsü -->
    <div id="start-screen">
      <h1>OsLevel Devil</h1>
      <button class="main-btn" onclick="startGame()">OYUNA BAŞLA</button>
      <label class="file-input-label">
        📂 Harita Dosyası Yükle (.json)
        <input type="file" id="level-file" accept=".json" style="display:none;" onchange="loadCustomLevelFile(event)">
      </label>
    </div>

    <!-- Üst Bar -->
    <div class="top-bar">
      <div class="title" id="lvl-title">OsLevel Devil - Seviye 1</div>
      <div>
        <button class="btn-sm" id="edit-mode-btn" onclick="toggleEditMode()">🛠️ Bölüm Yap</button>
        <button class="btn-sm" id="download-btn" style="display:none;" onclick="downloadJSON()">💾 Haritayı İndir</button>
      </div>
    </div>

    <!-- Editör Araç Barı -->
    <div id="editor-bar">
      <button class="tool-btn selected" onclick="selectTool('platform')">⬜ Zemin</button>
      <button class="tool-btn" onclick="selectTool('spike')">🔺 Diken</button>
      <button class="tool-btn" onclick="selectTool('button')">🔘 Buton</button>
      <button class="tool-btn" onclick="selectTool('door')">🟩 Kapı</button>
      <button class="tool-btn" onclick="selectTool('player')">🟨 Oyuncu</button>
      <button class="tool-btn" onclick="clearCurrentLevel()" style="background:#822;">🗑️ Temizle</button>
    </div>

    <!-- Canvas -->
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <!-- Dokunmatik Kontroller -->
    <div id="touch-controls">
      <div class="t-group">
        <div class="t-btn" id="b-left">◀</div>
        <div class="t-btn" id="b-right">▶</div>
      </div>
      <div class="t-group">
        <div class="t-btn" id="b-jump">▲</div>
      </div>
    </div>

    <!-- Obje Ayar Penceresi (Modal) -->
    <div id="modal-overlay">
      <div class="modal-box">
        <h3>Obje Ayarları</h3>
        <label>Dokunulabilir (Solid): <input type="checkbox" id="m-solid"></label>
        <label>Görünür (Visible): <input type="checkbox" id="m-visible"></label>
        <label>Öldürücü (Lethal): <input type="checkbox" id="m-lethal"></label>
        <hr>
        <h4>Hareket Ayarları</h4>
        <label>Yön: 
          <select id="m-dir">
            <option value="none">Yok</option>
            <option value="right">Sağ</option>
            <option value="left">Sol</option>
            <option value="up">Yukarı</option>
            <option value="down">Aşağı</option>
          </select>
        </label>
        <label>Mesafe (1-100 Kare): <input type="number" id="m-dist" min="1" max="100" value="5"></label>
        <label>Çalıştıran Buton ID: <input type="text" id="m-btn-id" placeholder="Boş = Otomatik"></label>
        <hr>
        <div style="display:flex; justify-size:space-between; gap:5px;">
          <button class="btn-sm" style="background:#00FF66; color:#000;" onclick="saveObjectSettings()">Kaydet</button>
          <button class="btn-sm" style="background:#aa2222;" onclick="deleteSelectedObject()">Sil</button>
          <button class="btn-sm" onclick="closeModal()">İptal</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const GRID_SIZE = 20; // 20x20 Izgara Kareleri
    let isEditMode = false;
    let isGameStarted = false;
    let selectedTool = 'platform';
    let selectedObj = null;

    let gameLevels = [
      {
        playerStart: { x: 40, y: 320 },
        door: { x: 740, y: 320 },
        objects: [
          { x: 0, y: 360, width: 800, height: 40, solid: true, visible: true, lethal: false, dir: 'none' }
        ]
      }
    ];

    let currentLevelIndex = 0;
    let currentLevel = null;

    const player = { x: 0, y: 0, width: 20, height: 20, vx: 0, vy: 0, speed: 4, jumpForce: 10, gravity: 0.45, grounded: false };
    const keys = { left: false, right: false, jump: false };

    // Tuş Dinleyicileri
    window.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
      if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
      if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") keys.jump = true;
    });
    window.addEventListener("keyup", e => {
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
      if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
      if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") keys.jump = false;
    });

    const bindTouch = (id, key) => {
      const el = document.getElementById(id);
      el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[key] = true; });
      el.addEventListener("touchend", (e) => { e.preventDefault(); keys[key] = false; });
    };
    bindTouch("b-left", "left");
    bindTouch("b-right", "right");
    bindTouch("b-jump", "jump");

    function startGame() {
      document.getElementById("start-screen").style.display = "none";
      isGameStarted = true;
      loadLevel(0);
    }

    function loadLevel(idx) {
      if (idx >= gameLevels.length) idx = 0;
      currentLevelIndex = idx;
      currentLevel = JSON.parse(JSON.stringify(gameLevels[currentLevelIndex]));
      
      // Obje durumlarını ve hareket değişkenlerini sıfırla
      currentLevel.objects.forEach(o => {
        o.startX = o.x;
        o.startY = o.y;
        o.currentDist = 0;
        o.active = !o.triggerBtnId; // Bir butona bağlı değilse baştan aktif
      });

      player.x = currentLevel.playerStart.x;
      player.y = currentLevel.playerStart.y;
      player.vx = 0; player.vy = 0;
      document.getElementById("lvl-title").innerText = `OsLevel Devil - Seviye ${currentLevelIndex + 1}`;
    }

    // --- HARİTA VE EDİTÖR İŞLEMLERİ ---
    function toggleEditMode() {
      isEditMode = !isEditMode;
      const btn = document.getElementById("edit-mode-btn");
      const bar = document.getElementById("editor-bar");
      const dlBtn = document.getElementById("download-btn");
      const touchBtns = document.getElementById("touch-controls");

      if (isEditMode) {
        btn.classList.add("active");
        btn.innerText = "▶️ Oyuna Dön";
        bar.style.display = "flex";
        dlBtn.style.display = "inline-block";
        touchBtns.style.display = "none";
      } else {
        btn.classList.remove("active");
        btn.innerText = "🛠️ Bölüm Yap";
        bar.style.display = "none";
        dlBtn.style.display = "none";
        touchBtns.style.display = "flex";
        gameLevels[currentLevelIndex] = JSON.parse(JSON.stringify(currentLevel));
        loadLevel(currentLevelIndex);
      }
    }

    function selectTool(t) {
      selectedTool = t;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('selected'));
      event.target.classList.add('selected');
    }

    function clearCurrentLevel() {
      currentLevel.objects = [];
    }

    // Tıklama ile Obje Ekleme / Seçme (Grid Snap)
    canvas.addEventListener("click", (e) => {
      if (!isEditMode) return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const clickX = (e.clientX - rect.left) * scaleX;
      const clickY = (e.clientY - rect.top) * scaleY;

      // Önce tıklanan yerde obje var mı kontrol et (Varsa ayarlarını aç)
      const clickedObj = currentLevel.objects.find(o => 
        clickX >= o.x && clickX <= o.x + o.width &&
        clickY >= o.y && clickY <= o.y + o.height
      );

      if (clickedObj) {
        openModal(clickedObj);
        return;
      }

      // Yoksa Grid'e hizalayarak yeni obje ekle
      const gridX = Math.floor(clickX / GRID_SIZE) * GRID_SIZE;
      const gridY = Math.floor(clickY / GRID_SIZE) * GRID_SIZE;

      if (selectedTool === 'platform') {
        currentLevel.objects.push({ x: gridX, y: gridY, width: 60, height: 20, solid: true, visible: true, lethal: false, dir: 'none', dist: 5 });
      } else if (selectedTool === 'spike') {
        currentLevel.objects.push({ x: gridX, y: gridY, width: 20, height: 20, solid: false, visible: true, lethal: true, dir: 'none', dist: 5 });
      } else if (selectedTool === 'button') {
        currentLevel.objects.push({ x: gridX, y: gridY + 10, width: 20, height: 10, solid: false, visible: true, lethal: false, isButton: true, btnId: '1' });
      } else if (selectedTool === 'door') {
        currentLevel.door = { x: gridX, y: gridY - 20 };
      } else if (selectedTool === 'player') {
        currentLevel.playerStart = { x: gridX, y: gridY };
        player.x = gridX; player.y = gridY;
      }
    });

    // Modal Ayar Yönetimi
    function openModal(obj) {
      selectedObj = obj;
      document.getElementById("m-solid").checked = obj.solid ?? true;
      document.getElementById("m-visible").checked = obj.visible ?? true;
      document.getElementById("m-lethal").checked = obj.lethal ?? false;
      document.getElementById("m-dir").value = obj.dir || 'none';
      document.getElementById("m-dist").value = obj.dist || 5;
      document.getElementById("m-btn-id").value = obj.triggerBtnId || obj.btnId || '';
      document.getElementById("modal-overlay").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal-overlay").style.display = "none";
      selectedObj = null;
    }

    function saveObjectSettings() {
      if (!selectedObj) return;
      selectedObj.solid = document.getElementById("m-solid").checked;
      selectedObj.visible = document.getElementById("m-visible").checked;
      selectedObj.lethal = document.getElementById("m-lethal").checked;
      selectedObj.dir = document.getElementById("m-dir").value;
      selectedObj.dist = parseInt(document.getElementById("m-dist").value) || 1;
      
      const btnIdVal = document.getElementById("m-btn-id").value;
      if (selectedObj.isButton) {
        selectedObj.btnId = btnIdVal;
      } else {
        selectedObj.triggerBtnId = btnIdVal;
      }

      closeModal();
    }

    function deleteSelectedObject() {
      if (!selectedObj) return;
      currentLevel.objects = currentLevel.objects.filter(o => o !== selectedObj);
      closeModal();
    }

    // Dosya Yükleme ve İndirme
    function downloadJSON() {
      gameLevels[currentLevelIndex] = JSON.parse(JSON.stringify(currentLevel));
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(gameLevels, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", "levels.json");
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function loadCustomLevelFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const loaded = JSON.parse(evt.target.result);
          if (Array.isArray(loaded)) {
            gameLevels = loaded;
            alert("Haritalar başarıyla yüklendi!");
            startGame();
          }
        } catch(err) { alert("Dosya okunamadı!"); }
      };
      reader.readAsText(file);
    }

    function isColliding(r1, r2) {
      return (r1.x < r2.x + r2.width && r1.x + r1.width > r2.x &&
              r1.y < r2.y + r2.height && r1.y + r1.height > r2.y);
    }

    // Oyun Döngüsü - Güncelleme
    function update() {
      if (!isGameStarted || isEditMode || !currentLevel) return;

      if (keys.left) player.vx = -player.speed;
      else if (keys.right) player.vx = player.speed;
      else player.vx = 0;

      if (keys.jump && player.grounded) {
        player.vy = -player.jumpForce;
        player.grounded = false;
      }

      player.vy += player.gravity;

      // Obje Hareket Mantığı ve Buton Tetikleme
      currentLevel.objects.forEach(o => {
        if (o.dir && o.dir !== 'none' && o.active) {
          const maxPixel = (o.dist || 5) * GRID_SIZE;
          const speed = 2;
          
          if (!o.moveState) o.moveState = 1;

          if (o.dir === 'right') {
            o.x += speed * o.moveState;
            if (o.x >= o.startX + maxPixel || o.x <= o.startX) o.moveState *= -1;
          } else if (o.dir === 'left') {
            o.x -= speed * o.moveState;
            if (o.x <= o.startX - maxPixel || o.x >= o.startX) o.moveState *= -1;
          } else if (o.dir === 'up') {
            o.y -= speed * o.moveState;
            if (o.y <= o.startY - maxPixel || o.y >= o.startY) o.moveState *= -1;
          } else if (o.dir === 'down') {
            o.y += speed * o.moveState;
            if (o.y >= o.startY + maxPixel || o.y <= o.startY) o.moveState *= -1;
          }
        }

        // Butona Basılma Kontrolü
        if (o.isButton && isColliding(player, o)) {
          const targetId = o.btnId;
          currentLevel.objects.forEach(targetObj => {
            if (targetObj.triggerBtnId === targetId) {
              targetObj.active = true; // Buton basılınca bağlı objeyi hareket ettir
            }
          });
        }

        // Öldürücü Obje Çarpışması
        if (o.lethal && isColliding(player, o)) {
          loadLevel(currentLevelIndex);
        }
      });

      // Fiziksel Çarpışmalar (Solid Objeler)
      player.x += player.vx;
      currentLevel.objects.forEach(o => {
        if (o.solid && isColliding(player, o)) {
          if (player.vx > 0) player.x = o.x - player.width;
          else if (player.vx < 0) player.x = o.x + o.width;
        }
      });

      player.y += player.vy;
      player.grounded = false;
      currentLevel.objects.forEach(o => {
        if (o.solid && isColliding(player, o)) {
          if (player.vy > 0) {
            player.y = o.y - player.height;
            player.vy = 0;
            player.grounded = true;
          } else if (player.vy < 0) {
            player.y = o.y + o.height;
            player.vy = 0;
          }
        }
      });

      // Kapı
      if (currentLevel.door && isColliding(player, { x: currentLevel.door.x, y: currentLevel.door.y, width: 30, height: 40 })) {
        currentLevelIndex++;
        loadLevel(currentLevelIndex);
      }

      // Düşme
      if (player.y > canvas.height + 50) loadLevel(currentLevelIndex);
    }

    // Çizim
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Editör Modunda Izgara (Grid) Çiz
      if (isEditMode) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += GRID_SIZE) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += GRID_SIZE) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
      }

      if (!currentLevel) return;

      // Objeleri Çiz
      currentLevel.objects.forEach(o => {
        if (!o.visible && !isEditMode) return; // Görünmezse ve editörde değilse çizme

        if (o.isButton) {
          ctx.fillStyle = "#FF0055";
        } else if (o.lethal) {
          ctx.fillStyle = "#FF3333";
        } else {
          ctx.fillStyle = o.solid ? "#FFFFFF" : "#888888";
        }

        ctx.globalAlpha = o.visible ? 1.0 : 0.4; // Editörde görünmez objeler yarı saydam görünür
        ctx.fillRect(o.x, o.y, o.width, o.height);
        ctx.globalAlpha = 1.0;
      });

      // Kapı
      if (currentLevel.door) {
        ctx.fillStyle = "#00FF66";
        ctx.fillRect(currentLevel.door.x, currentLevel.door.y, 30, 40);
      }

      // Oyuncu
      ctx.fillStyle = "#FFCC00";
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>

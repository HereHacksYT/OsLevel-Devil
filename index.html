<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OsLevel Devil</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 800px;
      max-height: 450px;
      background: #222;
      border: 2px solid #444;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .top-bar {
      height: 40px;
      background: #181818;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      z-index: 10;
    }
    .title { font-size: 14px; font-weight: bold; color: #FFCC00; }
    .btn-sm { background: #333; color: #fff; border: 1px solid #666; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .btn-sm.active { background: #00FF66; color: #000; font-weight: bold; }

    /* Editör Araçları Barı */
    #editor-bar {
      display: none;
      height: 35px;
      background: #2a2a2a;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 5px;
    }
    .tool-btn { background: #444; color: #fff; border: 1px solid #777; padding: 3px 6px; font-size: 10px; border-radius: 3px; cursor: pointer; }
    .tool-btn.selected { border: 2px solid #00FF66; background: #555; }

    /* Canvas Alanı */
    #canvas-holder { position: relative; flex: 1; width: 100%; height: 100%; }
    canvas { width: 100%; height: 100%; display: block; }

    /* Dokunmatik Tuşlar (Ekrana Sabitli) */
    #touch-controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 20;
    }
    .t-group { display: flex; gap: 10px; pointer-events: auto; }
    .t-btn {
      width: 45px; height: 45px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff; touch-action: manipulation;
    }
    .t-btn:active { background: rgba(255, 255, 255, 0.5); }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="top-bar">
      <div class="title" id="lvl-title">OsLevel Devil - Seviye 1</div>
      <div>
        <button class="btn-sm" id="edit-mode-btn" onclick="toggleEditMode()">🛠️ Bölüm Yap (Editör)</button>
        <button class="btn-sm" onclick="downloadJSON()">💾 Haritayı İndir</button>
      </div>
    </div>

    <!-- Editör Obje Seçim Menüsü -->
    <div id="editor-bar">
      <button class="tool-btn selected" onclick="selectTool('platform')">⬜ Zemin</button>
      <button class="tool-btn" onclick="selectTool('spike')">🔺 Diken</button>
      <button class="tool-btn" onclick="selectTool('door')">🟩 Kapı</button>
      <button class="tool-btn" onclick="selectTool('player')">🟨 Oyuncu</button>
      <button class="tool-btn" onclick="selectTool('fallPlatform')">🟫 Düşen Zemin</button>
      <button class="tool-btn" onclick="clearCurrentLevel()" style="background:#aa2222;">🗑️ Temizle</button>
    </div>

    <div id="canvas-holder">
      <canvas id="gameCanvas" width="800" height="400"></canvas>
      
      <!-- Ekran İçi Mobil Kontroller -->
      <div id="touch-controls">
        <div class="t-group">
          <div class="t-btn" id="b-left">◀</div>
          <div class="t-btn" id="b-right">▶</div>
        </div>
        <div class="t-group">
          <div class="t-btn" id="b-jump">▲</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let isEditMode = false;
    let selectedTool = 'platform';

    // GitHub'a koyacağın varsayılan seviyeler
    let gameLevels = [
      {
        playerStart: { x: 50, y: 300 },
        door: { x: 720, y: 310 },
        platforms: [
          { x: 0, y: 350, width: 250, height: 50 },
          { x: 250, y: 350, width: 150, height: 50, fallOnTouch: true, falling: false },
          { x: 550, y: 350, width: 250, height: 50 }
        ],
        spikes: [{ x: 200, y: 330, width: 30, height: 20 }]
      }
    ];

    // Sayfa açılınca varsa GitHub'daki levels.json dosyasından çekmeyi dener
    fetch('levels.json')
      .then(res => res.json())
      .then(data => { if(Array.isArray(data)) { gameLevels = data; loadLevel(0); } })
      .catch(() => { loadLevel(0); });

    let currentLevelIndex = 0;
    let currentLevel = null;

    const player = { x: 0, y: 0, width: 24, height: 24, vx: 0, vy: 0, speed: 4, jumpForce: 10.5, gravity: 0.45, grounded: false };
    const keys = { left: false, right: false, jump: false };

    // Klavye & Mobil Tuşlar
    window.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
      if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
      if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") keys.jump = true;
    });
    window.addEventListener("keyup", e => {
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
      if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
      if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") keys.jump = false;
    });

    const bindTouch = (id, key) => {
      const el = document.getElementById(id);
      el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[key] = true; });
      el.addEventListener("touchend", (e) => { e.preventDefault(); keys[key] = false; });
    };
    bindTouch("b-left", "left");
    bindTouch("b-right", "right");
    bindTouch("b-jump", "jump");

    function loadLevel(idx) {
      if (idx >= gameLevels.length) idx = 0;
      currentLevelIndex = idx;
      currentLevel = JSON.parse(JSON.stringify(gameLevels[currentLevelIndex]));
      player.x = currentLevel.playerStart.x;
      player.y = currentLevel.playerStart.y;
      player.vx = 0; player.vy = 0;
      document.getElementById("lvl-title").innerText = `OsLevel Devil - Seviye ${currentLevelIndex + 1}`;
    }

    // --- EDITÖR MODU MANTIĞI ---
    function toggleEditMode() {
      isEditMode = !isEditMode;
      const btn = document.getElementById("edit-mode-btn");
      const bar = document.getElementById("editor-bar");
      const touchBtns = document.getElementById("touch-controls");

      if (isEditMode) {
        btn.classList.add("active");
        btn.innerText = "▶️ Oyuna Dön";
        bar.style.display = "flex";
        touchBtns.style.display = "none";
      } else {
        btn.classList.remove("active");
        btn.innerText = "🛠️ Bölüm Yap (Editör)";
        bar.style.display = "none";
        touchBtns.style.display = "flex";
        // Yapılan değişiklikleri oyuna uygula
        gameLevels[currentLevelIndex] = JSON.parse(JSON.stringify(currentLevel));
        loadLevel(currentLevelIndex);
      }
    }

    function selectTool(tool) {
      selectedTool = tool;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('selected'));
      event.target.classList.add('selected');
    }

    function clearCurrentLevel() {
      currentLevel.platforms = [];
      currentLevel.spikes = [];
    }

    // Canvas Tıklama ile Obje Ekleme
    canvas.addEventListener("click", (e) => {
      if (!isEditMode) return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const clickX = Math.floor((e.clientX - rect.left) * scaleX);
      const clickY = Math.floor((e.clientY - rect.top) * scaleY);

      if (selectedTool === 'platform') {
        currentLevel.platforms.push({ x: clickX - 40, y: clickY - 10, width: 80, height: 20 });
      } else if (selectedTool === 'fallPlatform') {
        currentLevel.platforms.push({ x: clickX - 40, y: clickY - 10, width: 80, height: 20, fallOnTouch: true, falling: false });
      } else if (selectedTool === 'spike') {
        currentLevel.spikes.push({ x: clickX - 15, y: clickY - 20, width: 30, height: 20 });
      } else if (selectedTool === 'door') {
        currentLevel.door = { x: clickX - 15, y: clickY - 40 };
      } else if (selectedTool === 'player') {
        currentLevel.playerStart = { x: clickX - 12, y: clickY - 12 };
        player.x = clickX - 12; player.y = clickY - 12;
      }
    });

    // HARİTAYI JSON OLARAK İNDİRME
    function downloadJSON() {
      gameLevels[currentLevelIndex] = JSON.parse(JSON.stringify(currentLevel));
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(gameLevels, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", "levels.json");
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function isColliding(r1, r2) {
      return (r1.x < r2.x + r2.width && r1.x + r1.width > r2.x &&
              r1.y < r2.y + r2.height && r1.y + r1.height > r2.y);
    }

    function update() {
      if (isEditMode || !currentLevel) return;

      if (keys.left) player.vx = -player.speed;
      else if (keys.right) player.vx = player.speed;
      else player.vx = 0;

      if (keys.jump && player.grounded) {
        player.vy = -player.jumpForce;
        player.grounded = false;
      }

      player.vy += player.gravity;
      player.x += player.vx;

      currentLevel.platforms.forEach(plat => {
        if (isColliding(player, plat)) {
          if (player.vx > 0) player.x = plat.x - player.width;
          else if (player.vx < 0) player.x = plat.x + plat.width;
        }
      });

      player.y += player.vy;
      player.grounded = false;

      currentLevel.platforms.forEach(plat => {
        if (isColliding(player, plat)) {
          if (player.vy > 0) {
            player.y = plat.y - player.height;
            player.vy = 0;
            player.grounded = true;
            if (plat.fallOnTouch) plat.falling = true;
          } else if (player.vy < 0) {
            player.y = plat.y + plat.height;
            player.vy = 0;
          }
        }
        if (plat.falling) plat.y += 6;
      });

      if (currentLevel.spikes) {
        currentLevel.spikes.forEach(spike => {
          if (isColliding(player, spike)) loadLevel(currentLevelIndex);
        });
      }

      if (currentLevel.door && isColliding(player, { x: currentLevel.door.x, y: currentLevel.door.y, width: 30, height: 40 })) {
        currentLevelIndex++;
        loadLevel(currentLevelIndex);
      }

      if (player.y > canvas.height + 100) loadLevel(currentLevelIndex);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!currentLevel) return;

      // Platformlar
      currentLevel.platforms.forEach(plat => {
        ctx.fillStyle = plat.fallOnTouch ? "#8B4513" : "#fff";
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
      });

      // Dikenler
      ctx.fillStyle = "#FF3333";
      if (currentLevel.spikes) {
        currentLevel.spikes.forEach(spike => {
          ctx.beginPath();
          ctx.moveTo(spike.x, spike.y + spike.height);
          ctx.lineTo(spike.x + spike.width / 2, spike.y);
          ctx.lineTo(spike.x + spike.width, spike.y + spike.height);
          ctx.fill();
        });
      }

      // Kapı
      if (currentLevel.door) {
        ctx.fillStyle = "#00FF66";
        ctx.fillRect(currentLevel.door.x, currentLevel.door.y, 30, 40);
      }

      // Oyuncu
      ctx.fillStyle = "#FFCC00";
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
